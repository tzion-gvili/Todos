<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משימות בכיף – ניהול פרויקט משותף</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Suez+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>

  <header class="topbar">
    <div class="brand">
      <span>⚡</span>
      <span class="brand-name">משימות בכיף</span>
    </div>
    <div class="top-actions">
      <div id="cloudStatus" class="cloud-chip local">💾 שמירה מקומית</div>
      <button id="soundToggleBtn" class="icon-btn" title="השתק / הפעל צלילים">🔊</button>
      <button id="copyLinkBtn" class="icon-btn hidden" title="העתק קוד פרויקט לשיתוף">🔗</button>
      <button id="logoutBtn" class="icon-btn hidden" title="יציאה מפרויקט">🚪</button>
    </div>
  </header>

  <main>
    <section id="loginView" class="login">
      <div class="hero-icon">🚀</div>
      <h1>מנהלים <span class="hl">ביחד</span></h1>
      <p class="muted">הכנס תעודת זהות או קוד ייחודי אחר כדי להיכנס ללוח המשותף</p>

      <div class="login-card">
        <label for="projectIdInput">הכנס תעודת זהות או קוד ייחודי אחר</label>
        <div class="code-row">
          <input id="projectIdInput" type="text" placeholder="הכנס תעודת זהות או קוד ייחודי אחר" maxlength="20" />
        </div>
        <button id="enterBtn" class="btn" type="button">כניסה לפרויקט ✨</button>
      </div>
    </section>

    <section id="boardView" class="hidden">
      <div class="project-banner">
        <div class="project-badge">פרויקט: <span id="activeProjectLabel" class="ltr"></span></div>
        <div class="banner-actions">
          <button id="shareWaBtn" class="btn wa-btn small" title="שלח סיכום משימות ותקציב לוואטסאפ">💬 סיכום לוואטסאפ</button>
          <button id="exportExcelBtn" class="btn excel-btn small" title="הורד קובץ אקסל (CSV) מסודר">📊 ייצוא לאקסל</button>
          <button id="openAddModalBtn" class="btn">+ הוספת משימה חדשה</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat" style="--c: var(--todo)">
          <span>📋</span>
          <b id="statTotal">0</b>
          <small>סה"כ משימות</small>
        </div>
        <div class="stat" style="--c: var(--good)">
          <span>✅</span>
          <b id="statDone">0</b>
          <small>בוצעו</small>
        </div>
        <div class="stat" style="--c: var(--gold)">
          <span>💰</span>
          <b id="statCost">0 ₪</b>
          <small>עלות כוללת</small>
        </div>
        <div class="stat" style="--c: var(--doing)">
          <span>💳</span>
          <b id="statDeposit">0 ₪</b>
          <small>מקדמות ששולמו</small>
        </div>
        <div class="stat" style="--c: var(--bad)">
          <span>⏳</span>
          <b id="statBalance">0 ₪</b>
          <small>יתרה לתשלום</small>
        </div>
      </div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="🔍 חיפוש לפי כותרת, תיאור, טלפון או הערות..." />
        <select id="filterStatus">
          <option value="all">כל הסטטוסים</option>
          <option value="todo">📌 עוד לא התחיל</option>
          <option value="doing">⚙️ עובדים על זה</option>
          <option value="waiting">⏳ מחכה ל...</option>
          <option value="done">✅ בוצע</option>
        </select>
        <select id="sortBy" title="בחר סדר מיון">
          <option value="newest">🆕 מיון: הכי חדש</option>
          <option value="balance">💸 מיון: יתרה לתשלום (מהגבוה)</option>
          <option value="price">💰 מיון: עלות כוללת (מהגבוה)</option>
          <option value="status">📊 מיון: לפי סטטוס (פתוחות קודם)</option>
          <option value="title">🔤 מיון: לפי כותרת (א-ת)</option>
        </select>
      </div>

      <div id="taskGrid" class="task-grid"></div>
    </section>
  </main>

  <!-- אזור פרסומות מתחלפות מתוך ads.json -->
  <section id="adZone" class="ad-zone hidden">
    <div class="ad-label">📢 הודעות וחסויות</div>
    <div id="adCard" class="ad-card"></div>
    <div class="ad-progress"><i id="adBar"></i></div>
    <div id="adDots" class="ad-dots"></div>
  </section>

  <div id="taskModal" class="modal hidden">
    <div class="modal-card">
      <h2 id="modalTitle" style="margin-top:0">משימה חדשה</h2>
      <form id="taskForm" class="form">
        <input type="hidden" id="taskId" />
        <label>
          כותרת המשימה *
          <input id="taskTitle" type="text" required placeholder="מה צריך לעשות?" />
        </label>
        <label>
          סטטוס
          <select id="taskStatus">
            <option value="todo">📌 עוד לא התחיל</option>
            <option value="doing">⚙️ עובדים על זה</option>
            <option value="waiting">⏳ מחכה ל...</option>
            <option value="done">✅ בוצע</option>
          </select>
        </label>
        <div class="form-row-2">
          <label>
            מחיר / עלות כוללת (₪)
            <input id="taskPrice" type="number" min="0" step="1" placeholder="0" />
          </label>
          <label>
            מקדמה ששולמה (₪)
            <input id="taskDeposit" type="number" min="0" step="1" placeholder="0" />
          </label>
        </div>
        <label>
          טלפון איש קשר / ספק
          <div class="phone-input-row">
            <input id="taskPhone" type="tel" autocomplete="tel" placeholder="050-0000000" />
            <button type="button" id="pickContactBtn" class="btn secondary contact-btn" title="בחר מתוך אנשי הקשר בטלפון">📇 אנשי קשר</button>
          </div>
        </label>
        <label>
          תיאור מפורט
          <textarea id="taskDesc" rows="2" placeholder="פרטים נוספים על המשימה..."></textarea>
        </label>
        <label>
          הערות (למשל: למי מחכים, שם ספק)
          <input id="taskNotes" type="text" placeholder="הערות קצרות..." />
        </label>
        <div class="modal-actions">
          <button type="button" id="closeModalBtn" class="btn secondary">ביטול</button>
          <button type="submit" class="btn">שמירה 💾</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <footer class="site-footer">
    פותח באהבה על ידי TgSofts · 052-5914007
  </footer>

  <script src="config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const STATUS_LABELS = {
      todo: 'עוד לא התחיל',
      doing: 'עובדים על זה',
      waiting: 'מחכה ל...',
      done: 'בוצע'
    };

    const STATUS_ORDER = {
      doing: 1,
      waiting: 2,
      todo: 3,
      done: 4
    };

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // --- מנוע צלילים מתוקים ---
    let soundOn = localStorage.getItem('todo_sound') !== 'off';
    const soundBtn = document.getElementById('soundToggleBtn');
    soundBtn.textContent = soundOn ? '🔊' : '🔇';

    let audioCtx = null;
    function playTone(freqs, type = 'sine', duration = 0.14, gap = 0.07) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(f, now + i * gap);
          gain.gain.setValueAtTime(0.12, now + i * gap);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * gap + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * gap);
          osc.stop(now + i * gap + duration);
        });
      } catch (e) {}
    }

    const sfx = {
      pop: () => playTone([520, 680], 'sine', 0.1, 0.04),
      enter: () => playTone([440, 554.37, 659.25], 'triangle', 0.16, 0.07),
      done: () => playTone([523.25, 659.25, 783.99, 1046.5], 'sine', 0.18, 0.08),
      del: () => playTone([380, 260], 'sine', 0.14, 0.06)
    };

    soundBtn.onclick = () => {
      soundOn = !soundOn;
      localStorage.setItem('todo_sound', soundOn ? 'on' : 'off');
      soundBtn.textContent = soundOn ? '🔊' : '🔇';
      if (soundOn) sfx.pop();
    };

    // --- שליפה מאנשי קשר ---
    const pickContactBtn = document.getElementById('pickContactBtn');
    pickContactBtn.onclick = async () => {
      sfx.pop();
      if ('contacts' in navigator && 'ContactsManager' in window) {
        try {
          const contacts = await navigator.contacts.select(['name', 'tel'], { multiple: false });
          if (contacts && contacts.length) {
            const c = contacts[0];
            if (c.tel && c.tel.length) {
              document.getElementById('taskPhone').value = c.tel[0].replace(/\s+/g, '');
            }
            if (c.name && c.name.length) {
              const notesInput = document.getElementById('taskNotes');
              if (!notesInput.value.trim()) {
                notesInput.value = 'איש קשר: ' + c.name[0];
              }
            }
            showToast('איש הקשר נטען 📇');
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            showToast('לא ניתן לפתוח אנשי קשר במכשיר זה', '');
          }
        }
      } else {
        showToast('זמין בדפדפני מובייל נתמכים (כרום באנדרואיד) – ניתן להדביק מספר ידנית', '');
        document.getElementById('taskPhone').focus();
      }
    };

    // --- מנוע פרסומות מתוך ads.json ---
    async function initAds() {
      try {
        const res = await fetch('ads.json?t=' + Date.now());
        if (!res.ok) return;
        const ads = await res.json();
        if (!Array.isArray(ads) || !ads.length) return;

        const zone = document.getElementById('adZone');
        const card = document.getElementById('adCard');
        const bar = document.getElementById('adBar');
        const dotsBox = document.getElementById('adDots');
        zone.classList.remove('hidden');

        let idx = 0;
        let timer = null;
        const DURATION = 6500;

        dotsBox.innerHTML = ads.map((_, i) => `<button class="dot ${i === 0 ? 'on' : ''}" data-i="${i}" aria-label="פרסומת ${i+1}"></button>`).join('');
        dotsBox.querySelectorAll('.dot').forEach(d => {
          d.onclick = () => { idx = Number(d.dataset.i); showAd(); };
        });

        function showAd() {
          const ad = ads[idx];
          card.classList.remove('in');
          void card.offsetWidth;
          card.classList.add('in');

          const phoneClean = (ad.phone || '').replace(/[^0-9]/g, '');
          const waPhone = phoneClean.startsWith('0') ? '972' + phoneClean.slice(1) : phoneClean;

          card.innerHTML = `
            <div class="ad-icon">${escapeHtml(ad.icon || '✨')}</div>
            <div class="ad-caption">${escapeHtml(ad.caption || '')}</div>
            <div class="ad-phrase">${escapeHtml(ad.catchPhrase || '')}</div>
            ${ad.phone ? `<a class="ad-phone" href="https://wa.me/${waPhone}" target="_blank" rel="noopener">📞 <span class="ltr">${escapeHtml(ad.phone)}</span></a>` : ''}
            ${ad.link ? `<a class="btn secondary ad-link" href="${escapeHtml(ad.link)}" target="_blank" rel="noopener">למעבר לאפליקציה 🔗</a>` : ''}
          `;

          dotsBox.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === idx));

          bar.style.transition = 'none';
          bar.style.width = '0%';
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              bar.style.transition = `width ${DURATION}ms linear`;
              bar.style.width = '100%';
            });
          });

          clearTimeout(timer);
          timer = setTimeout(() => {
            idx = (idx + 1) % ads.length;
            showAd();
          }, DURATION);
        }

        showAd();
      } catch (e) {
        console.log('Ads skipped:', e);
      }
    }
    initAds();

    // --- חיבור ל-Firebase וניהול משימות ---
    let db = null;
    let unsubscribe = null;
    let currentProjectId = '';
    let tasks = [];

    const hasCloud = window.CLOUD && window.CLOUD.apiKey && window.CLOUD.projectId;
    const cloudChip = document.getElementById('cloudStatus');

    if (hasCloud) {
      try {
        const app = initializeApp({
          apiKey: window.CLOUD.apiKey,
          projectId: window.CLOUD.projectId
        });
        db = getFirestore(app);
        setCloudState('saved', '☁️ מחובר לענן');
      } catch (e) {
        console.error(e);
        setCloudState('local', '⚠️ שגיאת ענן (מקומי)');
      }
    }

    function setCloudState(cls, text) {
      cloudChip.className = 'cloud-chip ' + cls;
      cloudChip.textContent = text;
    }

    function showToast(msg, type = 'good') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast show ${type}`;
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    document.getElementById('enterBtn').onclick = () => {
      const val = document.getElementById('projectIdInput').value.trim().toUpperCase();
      if (!val) return showToast('נא להזין תעודת זהות או קוד ייחודי', '');
      sfx.enter();
      openProject(val);
    };

    document.getElementById('projectIdInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('enterBtn').click();
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('id')) {
      openProject(urlParams.get('id').toUpperCase());
    }

    function openProject(pid) {
      currentProjectId = pid;
      document.getElementById('activeProjectLabel').textContent = pid;
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('boardView').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('copyLinkBtn').classList.remove('hidden');

      const newUrl = `${window.location.pathname}?id=${encodeURIComponent(pid)}`;
      window.history.replaceState({}, '', newUrl);

      if (db) {
        if (unsubscribe) unsubscribe();
        setCloudState('saving', '⏳ טוען...');
        unsubscribe = onSnapshot(doc(db, 'todo_projects', pid), (snap) => {
          tasks = snap.exists() ? (snap.data().tasks || []) : [];
          setCloudState('saved', '☁️ מסונכרן');
          render();
        }, (err) => {
          console.error(err);
          setCloudState('local', '⚠️ שגיאת סנכרון');
        });
      } else {
        const saved = localStorage.getItem('todo_' + pid);
        tasks = saved ? JSON.parse(saved) : [];
        render();
      }
    }

    async function saveTasks() {
      render();
      if (db) {
        setCloudState('saving', '⏳ שומר...');
        await setDoc(doc(db, 'todo_projects', currentProjectId), {
          tasks,
          updatedAt: Date.now()
        });
        setCloudState('saved', '☁️ נשמר בענן');
      } else {
        localStorage.setItem('todo_' + currentProjectId, JSON.stringify(tasks));
      }
    }

    document.getElementById('logoutBtn').onclick = () => {
      sfx.del();
      if (unsubscribe) unsubscribe();
      window.history.replaceState({}, '', window.location.pathname);
      document.getElementById('boardView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
      document.getElementById('copyLinkBtn').classList.add('hidden');
    };

    document.getElementById('copyLinkBtn').onclick = () => {
      sfx.pop();
      navigator.clipboard.writeText(window.location.href);
      showToast('הקישור לפרויקט הועתק! שלח אותו לשותפים 🔗');
    };

    // --- שיתוף סיכום לוואטסאפ ---
    document.getElementById('shareWaBtn').onclick = () => {
      sfx.pop();
      if (!tasks.length) return showToast('אין עדיין משימות לסיכום', '');
      const totalCost = tasks.reduce((s, t) => s + (Number(t.price) || 0), 0);
      const totalDep = tasks.reduce((s, t) => s + (Number(t.deposit) || 0), 0);
      const doneCount = tasks.filter(t => t.status === 'done').length;

      let text = `⚡ *סיכום פרויקט: ${currentProjectId}*\n`;
      text += `📋 בוצעו: ${doneCount}/${tasks.length}\n`;
      text += `💰 עלות כוללת: ${totalCost.toLocaleString()} ₪\n`;
      text += `💳 שולם: ${totalDep.toLocaleString()} ₪ | ⏳ יתרה: ${(totalCost - totalDep).toLocaleString()} ₪\n\n`;
      text += `*רשימת משימות:*\n`;
      tasks.forEach(t => {
        const icon = t.status === 'done' ? '✅' : t.status === 'doing' ? '⚙️' : t.status === 'waiting' ? '⏳' : '📌';
        text += `${icon} ${t.title}${t.price ? ` (${Number(t.price).toLocaleString()} ₪)` : ''}\n`;
      });

      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    };

    // --- ייצוא לאקסל (CSV) ---
    document.getElementById('exportExcelBtn').onclick = () => {
      sfx.pop();
      if (!tasks.length) return showToast('אין נתונים לייצוא', '');
      const headers = ['כותרת', 'סטטוס', 'עלות כוללת', 'מקדמה', 'יתרה', 'טלפון', 'תיאור', 'הערות'];
      const rows = tasks.map(t => {
        const price = Number(t.price) || 0;
        const dep = Number(t.deposit) || 0;
        return [
          t.title,
          STATUS_LABELS[t.status] || t.status,
          price,
          dep,
          price - dep,
          t.phone || '',
          t.desc || '',
          t.notes || ''
        ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(',');
      });

      const csv = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tasks_${currentProjectId}.csv`;
      a.click();
      showToast('קובץ האקסל ירד בהצלחה 📊');
    };

    // --- ניהול מודאל והוספת/עריכת משימות ---
    const modal = document.getElementById('taskModal');
    const form = document.getElementById('taskForm');

    document.getElementById('openAddModalBtn').onclick = () => {
      sfx.pop();
      form.reset();
      document.getElementById('taskId').value = '';
      document.getElementById('modalTitle').textContent = 'משימה חדשה';
      modal.classList.remove('hidden');
    };

    document.getElementById('closeModalBtn').onclick = () => {
      modal.classList.add('hidden');
    };

    modal.onclick = (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    };

    form.onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById('taskId').value;
      const data = {
        id: id || Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        title: document.getElementById('taskTitle').value.trim(),
        status: document.getElementById('taskStatus').value,
        price: Number(document.getElementById('taskPrice').value) || 0,
        deposit: Number(document.getElementById('taskDeposit').value) || 0,
        phone: document.getElementById('taskPhone').value.trim(),
        desc: document.getElementById('taskDesc').value.trim(),
        notes: document.getElementById('taskNotes').value.trim(),
        createdAt: id ? (tasks.find(t => t.id === id)?.createdAt || Date.now()) : Date.now()
      };

      if (id) {
        const idx = tasks.findIndex(t => t.id === id);
        if (idx > -1) tasks[idx] = data;
      } else {
        tasks.unshift(data);
      }

      if (data.status === 'done') sfx.done(); else sfx.pop();
      modal.classList.add('hidden');
      await saveTasks();
      showToast(id ? 'המשימה עודכנה ✅' : 'המשימה נוספה ללוח 🎉');
    };

    window.editTask = (id) => {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      sfx.pop();
      document.getElementById('taskId').value = t.id;
      document.getElementById('taskTitle').value = t.title;
      document.getElementById('taskStatus').value = t.status;
      document.getElementById('taskPrice').value = t.price || '';
      document.getElementById('taskDeposit').value = t.deposit || '';
      document.getElementById('taskPhone').value = t.phone || '';
      document.getElementById('taskDesc').value = t.desc || '';
      document.getElementById('taskNotes').value = t.notes || '';
      document.getElementById('modalTitle').textContent = 'עריכת משימה';
      modal.classList.remove('hidden');
    };

    window.deleteTask = async (id) => {
      if (!confirm('למחוק את המשימה?')) return;
      sfx.del();
      tasks = tasks.filter(t => t.id !== id);
      await saveTasks();
      showToast('המשימה נמחקה 🗑️', '');
    };

    window.changeStatus = async (id, newStatus) => {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      t.status = newStatus;
      if (newStatus === 'done') sfx.done(); else sfx.pop();
      await saveTasks();
    };

    // --- רינדור הלוח והסטטיסטיקות ---
    document.getElementById('searchInput').oninput = render;
    document.getElementById('filterStatus').onchange = render;
    document.getElementById('sortBy').onchange = render;

    function render() {
      const total = tasks.length;
      const done = tasks.filter(t => t.status === 'done').length;
      const totalCost = tasks.reduce((s, t) => s + (Number(t.price) || 0), 0);
      const totalDep = tasks.reduce((s, t) => s + (Number(t.deposit) || 0), 0);
      const balance = totalCost - totalDep;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statDone').textContent = done;
      document.getElementById('statCost').textContent = totalCost.toLocaleString() + ' ₪';
      document.getElementById('statDeposit').textContent = totalDep.toLocaleString() + ' ₪';
      document.getElementById('statBalance').textContent = balance.toLocaleString() + ' ₪';

      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const filter = document.getElementById('filterStatus').value;
      const sort = document.getElementById('sortBy').value;

      let filtered = tasks.filter(t => {
        if (filter !== 'all' && t.status !== filter) return false;
        if (!q) return true;
        return [t.title, t.desc, t.phone, t.notes].some(f => (f || '').toLowerCase().includes(q));
      });

      filtered.sort((a, b) => {
        if (sort === 'balance') return ((b.price || 0) - (b.deposit || 0)) - ((a.price || 0) - (a.deposit || 0));
        if (sort === 'price') return (b.price || 0) - (a.price || 0);
        if (sort === 'status') return (STATUS_ORDER[a.status] || 9) - (STATUS_ORDER[b.status] || 9);
        if (sort === 'title') return (a.title || '').localeCompare(b.title || '', 'he');
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      const grid = document.getElementById('taskGrid');
      if (!filtered.length) {
        grid.innerHTML = `<div class="muted" style="grid-column:1/-1;text-align:center;padding:30px">אין משימות להצגה כרגע. לחצו על "+ הוספת משימה חדשה" כדי להתחיל! ✨</div>`;
        return;
      }

      grid.innerHTML = filtered.map(t => {
        const price = Number(t.price) || 0;
        const dep = Number(t.deposit) || 0;
        const rem = price - dep;
        const cleanPhone = (t.phone || '').replace(/[^0-9]/g, '');
        const waPhone = cleanPhone.startsWith('0') ? '972' + cleanPhone.slice(1) : cleanPhone;

        return `
          <div class="task-card st-${escapeHtml(t.status)}">
            <div>
              <div class="t-top">
                <h3 class="t-title">${escapeHtml(t.title)}</h3>
                ${price > 0 ? `<span class="t-price">${price.toLocaleString()} ₪</span>` : ''}
              </div>
              ${(price > 0 || dep > 0) ? `
                <div class="t-finance">
                  ${dep > 0 ? `<span class="fin-chip paid">שולם: ${dep.toLocaleString()} ₪</span>` : ''}
                  ${rem > 0 ? `<span class="fin-chip rem">יתרה: ${rem.toLocaleString()} ₪</span>` : ''}
                </div>
              ` : ''}
              ${t.desc ? `<p class="t-desc" style="margin-top:8px">${escapeHtml(t.desc)}</p>` : ''}
              ${t.notes ? `<div class="t-notes" style="margin-top:8px">📝 ${escapeHtml(t.notes)}</div>` : ''}
              ${cleanPhone ? `
                <div class="t-links">
                  <a class="t-action-pill tel" href="tel:${escapeHtml(cleanPhone)}">📞 <span class="ltr">${escapeHtml(t.phone)}</span></a>
                  <a class="t-action-pill wa" href="https://wa.me/${waPhone}" target="_blank" rel="noopener">💬 וואטסאפ</a>
                </div>
              ` : ''}
            </div>
            <div class="t-footer">
              <select class="status-select" onchange="changeStatus('${t.id}', this.value)">
                <option value="todo" ${t.status === 'todo' ? 'selected' : ''}>📌 עוד לא התחיל</option>
                <option value="doing" ${t.status === 'doing' ? 'selected' : ''}>⚙️ עובדים על זה</option>
                <option value="waiting" ${t.status === 'waiting' ? 'selected' : ''}>⏳ מחכה ל...</option>
                <option value="done" ${t.status === 'done' ? 'selected' : ''}>✅ בוצע</option>
              </select>
              <div class="t-actions">
                <button class="icon-btn" style="width:34px;height:34px;font-size:15px" onclick="editTask('${t.id}')" title="עריכה">✏️</button>
                <button class="icon-btn" style="width:34px;height:34px;font-size:15px" onclick="deleteTask('${t.id}')" title="מחיקה">🗑️</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
